[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cnc-task-ilc"
version = "0.1.0"
description = "Feasibility demo for task-level iterative learning in virtual CNC contouring"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.20",
  "scipy>=1.7",
  "matplotlib>=3.4",
]

[tool.setuptools.packages.find]
where = ["src"]

